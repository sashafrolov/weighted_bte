[package]
name = "weighted_btx_swapped"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Experimental G1/G2-swapped weighted BTX over BLS12-381"

[dependencies]
blstrs = { version = "0.7", features = ["serde", "__private_bench"] }
blst = "0.3"
ff = "0.13"
group = "0.13"
pairing = "0.23"
rand_core = { version = "0.6", features = ["getrandom"] }
rayon = "1.10"
serde = { version = "1.0", features = ["derive"] }
bincode = "1.3"
sha2 = "0.10"

[dev-dependencies]
weighted_btx = { path = "../weighted_btx" }
criterion = { version = "0.5", features = ["html_reports"] }
serde_json = "1.0"

[profile.dev]
opt-level = 3

[profile.release]
lto = "thin"
codegen-units = 1

[[bench]]
name = "phases"
harness = false

[[bench]]
name = "batch_layout"
harness = false
